<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt & Deals Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar (Hidden by default) -->
  <nav id="navbar" class="navbar glass-card hidden">
    <div class="nav-brand">Finance Tracker</div>
    <div class="nav-links">
      <a href="/debt-tracker" class="nav-link" id="nav-tracker">Dashboard</a>
      <a href="/config" class="nav-link" id="nav-config">Config</a>
      <button id="logout-btn" class="btn outline-btn nav-btn">Logout</button>
    </div>
  </nav>

  <!-- Main Container -->
  <div id="main-content">
    
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="glass-card login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to manage your finances</p>
        <form id="login-form">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="name@example.com">
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <p id="login-error" class="error-text hidden"></p>
          <button type="submit" class="btn primary-btn" id="login-btn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Tracker Screen (/debt-tracker) -->
    <div id="tracker-screen" class="screen hidden">
      <div class="dashboard-grid">
        
        <!-- Credit Cards Section -->
        <div class="glass-card section-card">
          <div class="section-header">
            <h2>Credit Cards</h2>
          </div>
          
          <!-- Quick Add Bill -->
          <div class="quick-add-container">
            <form id="add-cc-bill-form" class="clean-form">
              <select id="cc-select" required>
                <option value="" disabled selected>Card</option>
                <!-- Injected via JS -->
              </select>
              <input type="number" id="cc-bill-amount" step="0.01" required placeholder="Amount (₹)">
              <button type="submit" class="btn primary-btn btn-icon">✔</button>
            </form>
          </div>

          <!-- Active Bills -->
          <div class="list-container mt-4">
            <h3 class="list-title">Active Bills: <span id="cc-total-amount">₹0.00</span></h3>
            <div id="cc-empty-state" class="empty-state hidden">No active bills!</div>
            <ul id="cc-list" class="item-list">
              <!-- Injected via JS -->
            </ul>
          </div>
        </div>

        <!-- Personal Deals Section -->
        <div class="glass-card section-card">
          <div class="section-header">
            <h2>Personal Deals</h2>
          </div>

          <!-- Quick Add Deal -->
          <div class="quick-add-container">
            <form id="add-deal-form" class="deal-inline-form">
              <select id="person-select" required class="deal-name">
                <option value="" disabled selected>Person</option>
                <!-- Injected via JS -->
              </select>
              <div class="amount-toggle-group">
                <button type="button" id="deal-type-btn" class="toggle-btn given" data-type="given" title="Toggle Given(+)/Taken(-)">+</button>
                <input type="number" id="deal-amount" step="0.01" required placeholder="Amount (₹)" class="deal-amount">
              </div>
              <input type="text" id="deal-remarks" placeholder="Remarks" class="deal-remarks">
              <button type="submit" class="btn primary-btn btn-icon deal-submit">✔</button>
            </form>
          </div>

          <!-- Active Deals -->
          <div class="list-container mt-4">
            <h3 class="list-title">Active Deals: <span id="deals-total-amount">₹0.00</span></h3>
            <div id="deals-empty-state" class="empty-state hidden">No active deals!</div>
            <ul id="deals-list" class="item-list">
              <!-- Injected via JS -->
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Config Screen (/config) -->
    <div id="config-screen" class="screen hidden">
      <div class="dashboard-grid">
        
        <!-- Manage Credit Cards -->
        <div class="glass-card section-card">
          <h2>Manage Credit Cards</h2>
          <form id="config-cc-form" class="stacked-form">
            <div class="input-group">
              <label>Card Name</label>
              <input type="text" id="config-cc-name" required placeholder="e.g. Amazon Pay">
            </div>
            <div class="input-group">
              <label>Bank</label>
              <input type="text" id="config-cc-bank" required placeholder="e.g. ICICI">
            </div>
            <div class="input-group">
              <label>Due Date (Day of Month)</label>
              <input type="number" id="config-cc-due" min="1" max="31" required placeholder="e.g. 15">
            </div>
            <button type="submit" class="btn primary-btn">Add Credit Card</button>
          </form>
          
          <div class="config-list-container mt-4">
            <h3>Saved Cards</h3>
            <ul id="config-cc-list" class="simple-list"></ul>
          </div>
        </div>

        <!-- Manage People -->
        <div class="glass-card section-card">
          <h2>Manage People</h2>
          <form id="config-person-form" class="stacked-form">
            <div class="input-group">
              <label>Person Name</label>
              <input type="text" id="config-person-name" required placeholder="e.g. John Doe">
            </div>
            <button type="submit" class="btn primary-btn">Add Person</button>
          </form>
          
          <div class="config-list-container mt-4">
            <h3>Saved People</h3>
            <ul id="config-person-list" class="simple-list"></ul>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
